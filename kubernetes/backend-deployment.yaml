apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixmycar-backend
spec:
  replicas: 1
  selector:
    matchLabels: { app: fixmycar-backend }
  template:
    metadata:
      labels: { app: fixmycar-backend }
    spec:
      serviceAccountName: fixmycar
      containers:
        - name: fixmycar-backend
          image: us-central1-docker.pkg.dev/YOUR_PROJECT_ID/YOUR_ARTIFACT_REPO/backend-vertex-ai-search:latest
          imagePullPolicy: Always
          ports: [{ containerPort: 8080 }]
          env:
            - name: GOOGLE_CLOUD_PROJECT
              value: "YOUR_PROJECT_ID"
            - name: GOOGLE_CLOUD_LOCATION
              value: "YOUR_LOCATION"
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "true"
            - name: VERTEX_AI_DATASTORE_ID
              value: "YOUR_DATA_STORE"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
